<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grandal</title>
  </head>
  <body>
    <!-- Même structure que Starboard (mêmes identifiants : les modules partagés de src/ s'y branchent),
         sans onglets Vaisseau / Carte, sans vaisseau, dossier du personnel ni dossiers : une seule catégorie « Aventuriers ». -->
    <header class="topbar">
      <a class="brand" href="../../" title="Retour à l'accueil">GRANDAL</a>
      <div class="status">
        <span id="room-label">—</span>
        <span id="peer-count">Joueurs connectés : 1</span>
      </div>
      <div class="identity">
        <select id="name-select" title="Qui es-tu ? (un seul connecté par profil, sauf Observateur)"></select>
        <!-- Rôle fixe, déduit du profil (games/grandal/presence.js) : pas de menu de choix -->
        <span id="role-label" class="role-label" title="Rôle lié au profil"></span>
      </div>
      <nav class="view-tabs" id="view-tabs">
        <button data-view="map">Carte</button>
        <button data-view="roster">Fiches</button>
      </nav>
      <div class="tools">
        <div class="seg" id="roll-mode" title="Mode des jets">
          <button data-mode="normal" class="on">Normal</button>
          <button data-mode="adv">Avantage</button>
          <button data-mode="dis">Désavantage</button>
        </div>
        <label class="check" title="Jet visible seulement par toi et le MJ">
          <input type="checkbox" id="secret-roll" /> Jet secret
        </label>
        <span class="sep"></span>
        <button id="btn-add">+ Pion</button>
        <!-- Grandal : uniquement des d20 (games/grandal/dice.js) -->
        <button id="btn-d20" title="Jet libre d'un d20">d20</button>
        <span class="sep"></span>
        <button id="btn-export">Exporter</button>
        <label class="btn gm-only" for="file-import" title="Remplacer la partie par un fichier (MJ)">Importer</label>
        <input id="file-import" type="file" accept="application/json" hidden />
      </div>
    </header>

    <main>
      <!-- Aventuriers : 6 vignettes de même taille, sans défilement (games/grandal/party.js) -->
      <aside class="crew party">
        <h2>Aventuriers</h2>
        <div id="party-tiles" class="party-tiles"></div>
      </aside>
      <div class="stage">
        <canvas id="board"></canvas>
        <div id="scene-bar" class="stage-bar"></div>
        <div class="zoom-bar">
          <button id="btn-zoom-out" class="small" title="Dézoomer">−</button>
          <span id="zoom-label">100 %</span>
          <button id="btn-zoom-in" class="small" title="Zoomer">+</button>
          <button id="btn-fit" class="small" title="Recadrer sur la carte">Recadrer</button>
        </div>
        <!-- Onglet Fiches : toutes les fiches, choix du personnage de chaque vignette -->
        <section id="roster" class="roster" hidden>
          <header class="roster-head">
            <h2>Fiches des aventuriers</h2>
            <button id="btn-new-sheet" class="gm-only" title="Créer une fiche (MJ)">+ Fiche</button>
          </header>
          <!-- MJ : profils des joueurs (ajout / suppression), games/grandal/party.js -->
          <section id="profiles-admin" class="profiles-admin gm-only"></section>
          <div id="roster-pick" class="roster-pick" hidden></div>
          <div id="roster-grid" class="roster-grid"></div>
        </section>
        <section id="sheet" class="sheet" hidden></section>
      </div>
      <aside class="log">
        <section id="music" class="music"></section>
        <h2>Chronique</h2>
        <ul id="log-list"></ul>
      </aside>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
